[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maintenance-digital-twin"
version = "0.1.0"
description = "Research-backed manufacturing maintenance digital twin with RUL prediction and maintenance scheduling"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "httpx>=0.28,<1",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2",
  "scipy>=1.15,<2",
  "joblib>=1.4,<2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.11,<1"
]

[tool.setuptools.packages.find]
include = ["api*", "domain*", "services*", "ml*", "optimization*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 105
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
